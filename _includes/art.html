    function updateDualGeometry(szaDeg, vzaDeg, thetaDeg) {
        const szaRad = szaDeg * Math.PI / 180.0;
        const vzaRad = vzaDeg * Math.PI / 180.0;
        const thetaRad = thetaDeg * Math.PI / 180.0;

        // 1. Update Side Profile Zenith View
        const sideLen = 60;
        const sunX = 95 - sideLen * Math.sin(szaRad);
        const sunY = 130 - sideLen * Math.cos(szaRad);
        const senX = 95 + sideLen * Math.sin(vzaRad);
        const senY = 130 - sideLen * Math.cos(vzaRad);

        const sideSun = document.getElementById('side-sun');
        sideSun.setAttribute('x2', sunX);
        sideSun.setAttribute('y2', sunY);

        const sideSunBlock = document.getElementById('side-sun-block');
        sideSunBlock.setAttribute('cx', sunX);
        sideSunBlock.setAttribute('cy', sunY);

        const sideSunLbl = document.getElementById('side-sun-lbl');
        sideSunLbl.setAttribute('x', sunX - 20);
        sideSunLbl.setAttribute('y', sunY - 5);

        const sideSensor = document.getElementById('side-sensor');
        sideSensor.setAttribute('x2', senX);
        sideSensor.setAttribute('y2', senY);

        const sideSensorBlock = document.getElementById('side-sensor-block');
        sideSensorBlock.setAttribute('x', senX - 8);
        sideSensorBlock.setAttribute('y', senY - 6);

        const sideSensorLbl = document.getElementById('side-sensor-lbl');
        sideSensorLbl.setAttribute('x', senX + 10);
        sideSensorLbl.setAttribute('y', senY + 3);

        document.getElementById('side-angles-lbl').textContent = "SZA: " + szaDeg + " deg | VZA: " + vzaDeg + " deg";

        const tNorm = (thetaDeg - 50.0) / (180.0 - 50.0); 
        const compassAngleDeg = 130.0 * (1.0 - tNorm);
        const compassRad = compassAngleDeg * Math.PI / 180.0;

        const compRadius = 48;
        const senCompX = 95 + compRadius * Math.sin(compassRad);
        const senCompY = 95 - compRadius * Math.cos(compassRad);

        const topAzLine = document.getElementById('top-az-line');
        topAzLine.setAttribute('x2', senCompX);
        topAzLine.setAttribute('y2', senCompY);

        const topSensor = document.getElementById('top-sensor');
        topSensor.setAttribute('cx', senCompX);
        topSensor.setAttribute('cy', senCompY);

        const topSensorLabel = document.getElementById('top-sensor-label');
        topSensorLabel.setAttribute('x', senCompX + 8);
        topSensorLabel.setAttribute('y', senCompY + 4);

        document.getElementById('top-angles-lbl').textContent = "Scattering Angle: " + thetaDeg + " deg";
    }

    function updatePlot() {
        const grainRadius = parseFloat(document.getElementById('radius').value);
        const ssa = 3000000.0 / (917.0 * grainRadius);

        const dustInput = parseFloat(document.getElementById('dust').value);
        const dust = dustInput * 1e-9;

        const lwcPercent = parseFloat(document.getElementById('lwc').value);
        const lwc = lwcPercent / 100.0;

        const szaDeg = parseFloat(document.getElementById('sza').value);
        const vzaDeg = parseFloat(document.getElementById('vza').value);
        const theta = parseFloat(document.getElementById('theta').value);

        const cosSza = Math.cos(szaDeg * Math.PI / 180.0);
        const cosVza = Math.cos(vzaDeg * Math.PI / 180.0);

        document.getElementById('radius-val').innerText = grainRadius;
        document.getElementById('dust-val').innerText = dustInput;
        document.getElementById('lwc-val').innerText = lwcPercent.toFixed(1);
        document.getElementById('sza-val').innerText = szaDeg;
        document.getElementById('vza-val').innerText = vzaDeg;
        document.getElementById('theta-val').innerText = theta;

        updateDualGeometry(szaDeg, vzaDeg, theta);

        const d = 6.0 / (917.0 * ssa);
        const dustScaled = dust * (0.917 / (2.65 * (8.0 / Math.PI)));
        const p = 11.1 * Math.exp(-0.087 * theta) + 1.1 * Math.exp(-0.014 * theta);
        const r0 = (1.247 + 1.186 * (cosSza + cosVza) + 5.157 * cosSza * cosVza + p) / 4.0 / (cosSza + cosVza);
        const eps = (9.0 * (1.0 - 0.82)) / (16.0 * (r_ice[0]*r_ice[0]));
        const f_esc = ((0.6 * cosSza + 1.0/3.0 + Math.sqrt(cosSza)/3.0) * (0.6 * cosVza + 1.0/3.0 + Math.sqrt(cosVza)/3.0)) / r0;

        const newRho = wavelengths.map((wvl, i) => {
            const n_ice = r_ice[i];
            const ki = k_ice[i];
            const kw = k_water[i];
            const m = mae[i];

            const B0 = n_ice * n_ice;
            const eps_i = (9.0 * (1.0 - 0.82)) / (16.0 * B0);
            const k_eff = (1.0 - lwc) * ki + lwc * kw;
            const beta1 = 2.0 / d * m * dustScaled;
            const gamma_i = (4.0 * Math.PI * k_eff) / wavelengths[i];
            const l_param = d / eps_i;
            const r = Math.exp(-Math.sqrt((gamma_i + beta1) * l_param));
            return Math.max(0.0, r0 * Math.pow(r, f_esc));
        });

        const gd = document.querySelector('.plotly-graph-div');
        if (gd) {
            Plotly.update(gd, {y: [newRho]}, {});
        }
    }

    updateDualGeometry(30.0, 20.0, 130.0);

    ['radius', 'dust', 'lwc', 'sza', 'vza', 'theta'].forEach(id => {
        document.getElementById(id).addEventListener('input', updatePlot);
    });
